<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>청소년 쉼터 접근성 조회 서비스</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Mode Panel Toggle -->
    <div id="mode-panel" class="glass-panel mode-panel">
        <button id="btn-admin-mode" class="mode-btn active">시뮬레이션 모드 (관리자)</button>
        <button id="btn-youth-mode" class="mode-btn">쉼터 조회 모드 (청소년)</button>
    </div>
    
    <!-- Top Coverage Dashboard (Admin Mode) -->
    <div id="coverage-panel" class="glass-panel top-panel">
        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="address-input" class="search-input" placeholder="시/구/동 검색 (예: 강남구, 서구)">
            <button id="search-btn" class="search-btn" aria-label="검색">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        
        <div class="divider"></div>

        <div class="panel-header">
            <h2><i class="fa-solid fa-shield-cat"></i> 전국 쉼터 커버리지</h2>
            <div class="badge" id="coverage-badge">계산 중...</div>
        </div>
        
        <!-- Metrics Grid -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">커버리지</div>
                <div class="metric-value" id="metric-coverage">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">최장 거리</div>
                <div class="metric-value" id="metric-maxdist">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">미커버 지역 수</div>
                <div class="metric-value" id="metric-uncovered-count">-</div>
            </div>
        </div>
        
        <div class="uncovered-names-container">
            <div class="metric-label">가장 접근이 불리한 지역 (최장 거리 상위 3곳)</div>
            <div class="metric-value-names" id="metric-uncovered-names">-</div>
        </div>

        <div class="divider"></div>
        
        <!-- Coverage Curve Chart -->
        <div class="chart-container">
            <canvas id="coverage-chart" style="width: 100%; height: 130px;"></canvas>
            <div class="chart-label" id="chart-suggestion">계산 중...</div>
        </div>

        <div class="divider"></div>

        <!-- Region Diff List -->
        <div class="diff-container">
            <div class="metric-label">지역 목록 변화</div>
            <div class="diff-lists">
                <div class="diff-list diff-added">
                    <span class="diff-title">+ 새로 포함:</span>
                    <span id="diff-added-list" class="diff-content">없음</span>
                </div>
                <div class="diff-list diff-removed">
                    <span class="diff-title">− 제외됨:</span>
                    <span id="diff-removed-list" class="diff-content">없음</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bottom Controls Panel (Admin Mode) -->
    <div id="controls-panel" class="glass-panel bottom-panel">
        <!-- P Slider (Number of Shelters) -->
        <div class="control-group">
            <div class="control-header">
                <label for="p-slider"><i class="fa-solid fa-bus"></i> 이동형 쉼터 추가 투입 (p)</label>
                <span class="value-display"><span id="p-val">10</span>대</span>
            </div>
            <input type="range" id="p-slider" min="1" max="50" value="10" class="slider custom-slider">
        </div>
        
        <div class="divider"></div>
        
        <!-- Lambda Slider (Equity) -->
        <div class="control-group">
            <div class="control-header">
                <label for="lambda-slider"><i class="fa-solid fa-scale-balanced"></i> 배치 기준 설정 (λ)</label>
                <span class="value-display lambda-display" id="lambda-text">효율성 우선</span>
            </div>
            <input type="range" id="lambda-slider" min="0" max="1" step="0.1" value="0" class="slider lambda-slider">
            <div class="slider-labels">
                <span>효율 (이동거리 최소화)</span>
                <span>형평 (소외지역 구제)</span>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <!-- Lambda Extremes Comparison -->
        <div class="lambda-extremes">
            <div class="extreme-row" id="extreme-eff">
                <div class="extreme-header">λ = 0 효율 우선</div>
                <div class="extreme-body" id="eff-vals">커버리지 - | 최장 - | 미커버 -</div>
            </div>
            <div class="extreme-row" id="extreme-eq">
                <div class="extreme-header">λ = 1 형평 우선</div>
                <div class="extreme-body" id="eq-vals">커버리지 - | 최장 - | 미커버 -</div>
            </div>
        </div>
    </div>

    <!-- Youth Query Panel (Youth Mode, Hidden by Default) -->
    <div id="youth-panel" class="glass-panel youth-panel hidden">
        <div class="panel-header">
            <h2><i class="fa-solid fa-child-reaching"></i> 내 주변 청소년 쉼터 찾기</h2>
        </div>
        
        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="youth-address-input" class="search-input" placeholder="시/구/동 검색 (예: 강남구, 서구)">
            <button id="youth-search-btn" class="search-btn" aria-label="검색">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        
        <button id="youth-gps-btn" class="action-btn">
            <i class="fa-solid fa-location-crosshairs"></i> 내 위치 주변 쉼터 찾기
        </button>
        
        <div class="divider"></div>
        
        <div id="youth-results-container">
            <div class="empty-state">위치를 검색하거나 찾기 버튼을 눌러주세요.</div>
        </div>
    </div>

    <!-- GPS FAB (Floating Action Button, only for Admin Mode, can also be used globally) -->
    <button id="gps-btn" class="fab" aria-label="내 위치 찾기">
        <i class="fa-solid fa-location-crosshairs"></i>
    </button>
    
    <!-- GPS Modal (For fallback/detail popups) -->
    <div id="gps-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <button class="close-btn" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            <div id="modal-body">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/map.js"></script>
    <script src="js/optimization.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
