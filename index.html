<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>청소년 쉼터 접근성 조회 서비스</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Top Coverage Dashboard -->
    <div id="coverage-panel" class="glass-panel top-panel">
        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="address-input" class="search-input" placeholder="시/구/동 검색 (예: 강남구, 서구)">
            <button id="search-btn" class="search-btn" aria-label="검색">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        
        <div class="divider"></div>

        <div class="panel-header">
            <h2><i class="fa-solid fa-shield-cat"></i> 전국 쉼터 커버리지</h2>
            <div class="badge" id="coverage-badge">계산 중...</div>
        </div>
        <p class="coverage-desc" id="coverage-text">
            데이터를 불러오는 중입니다...
        </p>
        <div class="progress-container">
            <div class="progress-bar" id="coverage-progress"></div>
        </div>
    </div>
    
    <!-- Bottom Controls Panel -->
    <div id="controls-panel" class="glass-panel bottom-panel">
        <!-- P Slider (Number of Shelters) -->
        <div class="control-group">
            <div class="control-header">
                <label for="p-slider"><i class="fa-solid fa-bus"></i> 이동형 쉼터 추가 투입 (p)</label>
                <span class="value-display"><span id="p-val">10</span>대</span>
            </div>
            <input type="range" id="p-slider" min="1" max="50" value="10" class="slider custom-slider">
        </div>
        
        <div class="divider"></div>
        
        <!-- Lambda Slider (Equity) -->
        <div class="control-group">
            <div class="control-header">
                <label for="lambda-slider"><i class="fa-solid fa-scale-balanced"></i> 배치 기준 설정 (λ)</label>
                <span class="value-display lambda-display" id="lambda-text">효율성 우선</span>
            </div>
            <input type="range" id="lambda-slider" min="0" max="1" step="0.1" value="0" class="slider lambda-slider">
            <div class="slider-labels">
                <span>효율 (이동거리 최소화)</span>
                <span>형평 (소외지역 구제)</span>
            </div>
        </div>
    </div>

    <!-- GPS FAB (Floating Action Button) -->
    <button id="gps-btn" class="fab" aria-label="내 위치 찾기">
        <i class="fa-solid fa-location-crosshairs"></i>
    </button>
    
    <!-- GPS Modal -->
    <div id="gps-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <button class="close-btn" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            <div id="modal-body">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/optimization.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
