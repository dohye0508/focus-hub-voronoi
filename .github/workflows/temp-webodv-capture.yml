name: Temporary WebODV Capture

on:
  push:
    branches:
      - temp-webodv-capture-20260828

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture 37N WebODV sections
        continue-on-error: true
        run: |
          mkdir -p webodv-output
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const OUT='webodv-output';
          const URL='https://explore.webodv.awi.de/ocean/woa18/0.25-degree/1_all-years/1_annual/woa18_0.25deg_all-years_annual/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1920,height:1080},locale:'en-US',timezoneId:'UTC',ignoreHTTPSErrors:true,acceptDownloads:true});
          const page=await context.newPage();
          const report={started:new Date().toISOString(),errors:[],diagnostics:{},captures:[]};
          const logs=[];
          page.on('console',m=>logs.push(`[console:${m.type()}] ${m.text()}`));
          page.on('pageerror',e=>logs.push(`[pageerror] ${e.stack||e.message}`));
          page.on('requestfailed',r=>logs.push(`[requestfailed] ${r.url()} :: ${r.failure()?.errorText}`));
          const record=(stage,e)=>{const s=String(e?.stack||e);report.errors.push({stage,error:s});console.error(stage,s);};

          async function waitReady(){
            await page.waitForFunction(()=>{try{return typeof app!=='undefined'&&app.websocket?.readyState===1&&typeof coll!=='undefined'&&coll.dataVarCount?.()>0&&typeof view!=='undefined'&&document.getElementById('ImageArea')?.src?.startsWith('data:image/');}catch{return false;}},null,{timeout:180000});
            await page.waitForTimeout(4000);
          }
          async function waitCanvas(ms=7000){
            await page.waitForFunction(()=>{try{return appState.isCnvsReady?.()&&document.getElementById('ImageArea')?.src?.startsWith('data:image/');}catch{return false;}},null,{timeout:720000});
            await page.waitForTimeout(ms);
          }
          async function saveState(name,settings={}){
            const d=await page.evaluate(()=>{
              const img=document.getElementById('ImageArea');
              const canvas=document.getElementById('CanvasArea');
              const rect=e=>e?{left:e.getBoundingClientRect().left,top:e.getBoundingClientRect().top,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}:null;
              return {
                collection:coll.name,viewName:viewHistory.currentName(),description:viewHistory.current()?.descr,historySize:viewHistory.size(),appState:appState.current(),
                map:{west:view.mapWin.wLon,east:view.mapWin.eLon,south:view.mapWin.sLat,north:view.mapWin.nLat},
                section:view.section?{name:view.section.name,type:view.section.type,width:view.section.width,bathyType:view.section.bathyType,bathyColor:view.section.bathyColor,xNodes:view.section.xNodes,yNodes:view.section.yNodes,xml:view.section.toXml?.()}:null,
                windows:(view.dataWinArr||[]).map((w,i)=>({window:i+1,scope:w.scope,plotMode:w.plotMode,x:w.xvId,y:w.yvId,z:w.zvId,xRev:w.xRev,yRev:w.yRev,zRev:w.zRev,drawShaded:w.drawShaded,drawContours:w.drawContours,autoContours:w.autoContours,autoScale:w.autoScale,divaUseSectionPolygon:w.DivaUseSecPoly,divaBathymetry:w.DivaBathyFile,dataCount:viewInfo.dataCountsByWin?.[i],xml:w.toXml?.(i+1)})),
                odvRects:ui.odvCnvsRects,image:{naturalWidth:img?.naturalWidth,naturalHeight:img?.naturalHeight,box:rect(img)},canvas:{box:rect(canvas)},pointX:ui.ptgCnvsX,pointY:ui.ptgCnvsY,
                visibleInputs:[...document.querySelectorAll('input,select,button')].filter(e=>e.offsetParent!==null).map(e=>({tag:e.tagName,id:e.id,value:e.value,text:e.innerText,onclick:e.getAttribute('onclick')})),
                bodyText:document.body.innerText.slice(0,7000)
              };
            });
            fs.writeFileSync(path.join(OUT,`${name}.json`),JSON.stringify({settings,state:d},null,2));
            await page.screenshot({path:path.join(OUT,`${name}_full-page.png`),fullPage:true});
            if(await page.locator('#ImageArea').count())await page.locator('#ImageArea').screenshot({path:path.join(OUT,`${name}_webodv-canvas.png`)});
            return d;
          }
          async function exportWindow(win,name,settings){
            let downloaded=false;
            try{
              const p=page.waitForEvent('download',{timeout:300000});
              await page.evaluate(win=>app.sendWsMsg(Msg.exportGraphics(win,'png',200,'normal',false)),win);
              const d=await p;await d.saveAs(path.join(OUT,`${name}.png`));downloaded=true;
            }catch(e){record(`export:${name}`,e);}
            const s=await saveState(name,settings);report.captures.push({name,downloaded,settings,state:s});
          }

          try{
            await page.goto(URL,{waitUntil:'domcontentloaded',timeout:150000});
            await waitReady();

            const bounds={west:128,east:140,south:33,north:44};
            let before=await page.evaluate(()=>viewHistory.size());
            await page.evaluate(b=>app.sendWsMsg(Msg.setMapDomain(b.west,b.east,b.south,b.north)+','+Msg.msgGetCanvasCurrInfo),bounds);
            await page.waitForFunction(({before,b})=>viewHistory.size()>before&&Math.abs(view.mapWin.wLon-b.west)<1e-6&&Math.abs(view.mapWin.eLon-b.east)<1e-6&&Math.abs(view.mapWin.sLat-b.south)<1e-6&&Math.abs(view.mapWin.nLat-b.north)<1e-6,{before,b:bounds},{timeout:300000});
            await waitCanvas();
            await saveState('00_east_sea_map');

            await page.evaluate(()=>app.defSectionStart());
            await page.waitForFunction(()=>appState.current()===AppState.PointGetter&&ui.odvCnvsRects?.[0]&&document.getElementById('ImageArea')?.naturalWidth>0,null,{timeout:420000});
            await page.waitForTimeout(3000);

            const pointDiagnostic=await page.evaluate(()=>{
              const r=ui.odvCnvsRects[0];
              const img=document.getElementById('ImageArea');
              const box=img.getBoundingClientRect();
              const scaleX=img.naturalWidth/box.width;
              const scaleY=img.naturalHeight/box.height;
              const west=view.mapWin.wLon,east=view.mapWin.eLon,south=view.mapWin.sLat,north=view.mapWin.nLat;
              const dataPoint=(lon,lat)=>({naturalX:r.left+(lon-west)/(east-west)*(r.right-r.left),naturalY:r.bottom-(lat-south)/(north-south)*(r.bottom-r.top)});
              const p1=dataPoint(130,37),p2=dataPoint(138,37);
              const html1={x:p1.naturalX/scaleX,y:p1.naturalY/scaleY};
              const html2={x:p2.naturalX/scaleX,y:p2.naturalY/scaleY};
              ui.ptgCnvsX=[html1.x,html2.x];
              ui.ptgCnvsY=[html1.y,html2.y];
              return {r,natural:{width:img.naturalWidth,height:img.naturalHeight},rendered:{width:box.width,height:box.height},scaleX,scaleY,domain:{west,east,south,north},p1,p2,html1,html2,methods:Object.getOwnPropertyNames(Object.getPrototypeOf(ui)).filter(n=>n.toLowerCase().includes('odv')||n.toLowerCase().includes('canvas')||n.toLowerCase().includes('cnvs'))};
            });
            report.diagnostics.pointSelection=pointDiagnostic;
            await saveState('01_points_prepared');

            await page.evaluate(()=>ui.finishPointGettingOrZooming(true));
            await page.waitForFunction(()=>document.getElementById('SecName')&&document.getElementById('SecName').offsetParent!==null,null,{timeout:60000});
            await page.evaluate(()=>{
              document.getElementById('SecName').value='37N_130E_to_138E';
              document.getElementById('SecCoordSelect').value='1';
              document.getElementById('SecWidth').value='20';
              document.getElementById('SecBathySelect').value='3';
            });
            await saveState('02_section_properties_filled');

            before=await page.evaluate(()=>viewHistory.size());
            await page.evaluate(()=>DlgSecProps.onApply(Msg.createSection));
            await page.waitForFunction(before=>viewHistory.size()>before&&view.section?.isValid?.()&&view.section.xNodes?.length>=2&&view.section.yNodes?.length>=2&&view.section.xNodes.every(Number.isFinite)&&view.section.yNodes.every(Number.isFinite),before,{timeout:600000});
            await waitCanvas(10000);
            await saveState('03_section_defined',{section:'37N, 130E-138E',coordinate:'Longitude',meanWidthKm:20,bathymetry:'GEBCO'});

            before=await page.evaluate(()=>viewHistory.size());
            await page.evaluate(()=>app.layoutApply('miTwoSectionWin'));
            await page.waitForFunction(before=>viewHistory.size()>before&&view.dataWinArr?.length===2&&viewInfo.dataWinCount===2,before,{timeout:420000});
            await waitCanvas(8000);
            await saveState('04_two_section_layout');

            before=await page.evaluate(()=>{
              const before=viewHistory.size();
              view.setDataWinVars(1,2,App.VID_SECTION_COORD,0,1,'F','T','F');
              view.setDataWinVars(2,2,App.VID_SECTION_COORD,0,2,'F','T','F');
              for(const w of view.dataWinArr){
                w.plotMode=7;w.autoScale='T';w.xScale=2;w.yScale=2;w.isopycnicGridding='F';
                w.drawShaded='T';w.hideBad='T';w.hideDistance=3;w.drawContours='T';w.autoContours='T';w.contours=[];
                w.DivaUseSecPoly='T';w.DivaBathyFile='GEBCO_2023_2x2min_Global.nc';w.DivaBathyVal=App.missDOUBLE;
              }
              app.sendWsMsg(Msg.loadView(view.toXml(),'37N_Temperature_Salinity_DIVA','Set DIVA section variables'));
              return before;
            });
            await page.waitForFunction(before=>viewHistory.size()>before&&view.dataWinArr.length===2&&view.dataWinArr[0].scope===2&&view.dataWinArr[0].xvId===App.VID_SECTION_COORD&&view.dataWinArr[0].yvId===0&&view.dataWinArr[0].zvId===1&&view.dataWinArr[1].scope===2&&view.dataWinArr[1].xvId===App.VID_SECTION_COORD&&view.dataWinArr[1].yvId===0&&view.dataWinArr[1].zvId===2&&view.dataWinArr.every(w=>w.plotMode===7),before,{timeout:900000});
            await waitCanvas(15000);
            await saveState('05_diva_sections_ready');

            await exportWindow(1,'07_37N_130E-138E_temperature_section',{dataset:'WOA18 0.25 degree All-Years Annual',section:'37N, 130E-138E',x:'Section Coordinate: Longitude',y:'Depth [m]',z:'Temperature [degC]',gridding:'DIVA',bathymetry:'GEBCO',meanWidthKm:20});
            await exportWindow(2,'08_37N_130E-138E_salinity_section',{dataset:'WOA18 0.25 degree All-Years Annual',section:'37N, 130E-138E',x:'Section Coordinate: Longitude',y:'Depth [m]',z:'Salinity [psu]',gridding:'DIVA',bathymetry:'GEBCO',meanWidthKm:20});
          }catch(e){record('main',e);await saveState('failure').catch(()=>{});}finally{
            report.logs=logs;report.finished=new Date().toISOString();fs.writeFileSync(path.join(OUT,'capture-report.json'),JSON.stringify(report,null,2));
            await browser.close();
          }
          JS
          node capture.mjs > webodv-output/stdout.txt 2> webodv-output/stderr.txt
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webodv-37N-sections
          path: webodv-output
          retention-days: 1
