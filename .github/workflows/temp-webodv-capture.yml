name: Temporary WebODV Capture

on:
  push:
    branches:
      - temp-webodv-capture-20260828

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose dialogs
        continue-on-error: true
        run: |
          mkdir -p webodv-output
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const OUT='webodv-output';
          const url='https://explore.webodv.awi.de/ocean/woa18/0.25-degree/1_all-years/1_annual/woa18_0.25deg_all-years_annual/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1920,height:1080},locale:'en-US',timezoneId:'UTC',ignoreHTTPSErrors:true});
          const page=await context.newPage();
          const logs=[];
          page.on('console',m=>logs.push(`[console:${m.type()}] ${m.text()}`));
          page.on('pageerror',e=>logs.push(`[pageerror] ${e.stack||e.message}`));
          page.on('requestfailed',r=>logs.push(`[requestfailed] ${r.url()} :: ${r.failure()?.errorText}`));

          async function ready(){
            await page.waitForFunction(()=>typeof app!=='undefined'&&app.websocket?.readyState===1&&typeof coll!=='undefined'&&coll.dataVarCount?.()>0&&typeof view!=='undefined'&&document.getElementById('ImageArea')?.src?.startsWith('data:image/'),null,{timeout:180000});
            await page.waitForTimeout(4000);
          }
          async function dump(name){
            const data=await page.evaluate(()=>{
              const visible=e=>{const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&e.offsetParent!==null};
              const dialogs=[...document.querySelectorAll('.PopupDlg')].map((d,i)=>({index:i,id:d.id,visible:visible(d),text:d.innerText,html:d.outerHTML.slice(0,50000)}));
              const selects=[...document.querySelectorAll('select')].map(s=>({id:s.id,name:s.name,visible:visible(s),value:s.value,selectedIndex:s.selectedIndex,options:[...s.options].map((o,i)=>({i,text:o.text,value:o.value,selected:o.selected}))}));
              const inputs=[...document.querySelectorAll('input')].map(s=>({id:s.id,name:s.name,type:s.type,visible:visible(s),value:s.value,checked:s.checked}));
              const buttons=[...document.querySelectorAll('button')].map(b=>({id:b.id,visible:visible(b),text:b.innerText,onclick:b.getAttribute('onclick')}));
              return {
                title:document.title,viewName:viewHistory.currentName(),viewDescr:viewHistory.current()?.descr,
                windows:(view.dataWinArr||[]).map((w,i)=>({i:i+1,scope:w.scope,x:w.xvId,y:w.yvId,z:w.zvId,xml:w.toXmlAxisVars?.()})),
                section:view.section?{name:view.section.name,type:view.section.type,width:view.section.width,bathyType:view.section.bathyType,bathyColor:view.section.bathyColor,xNodes:view.section.xNodes,yNodes:view.section.yNodes,xml:view.section.toXml?.()}:null,
                dialogs,selects,inputs,buttons,
                bodyText:document.body.innerText.slice(0,25000)
              };
            });
            fs.writeFileSync(`${OUT}/${name}.json`,JSON.stringify(data,null,2));
            await page.screenshot({path:`${OUT}/${name}.png`,fullPage:true});
          }

          try{
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:150000});
            await ready();
            await page.evaluate(()=>app.layoutApply('miOneScatterWin'));
            await page.waitForFunction(()=>view.dataWinArr?.length===1&&viewInfo.dataWinCount===1&&viewHistory.current()?.descr==='Change View Template',null,{timeout:240000});
            await page.waitForTimeout(5000);
            await dump('00_scatter_loaded');

            for(const axis of ['X','Y','Z']){
              await page.evaluate(axis=>DlgAxisVar.show(1,axis),axis);
              await page.waitForTimeout(1500);
              await dump(`axis_${axis}`);
              await page.evaluate(()=>ui.hideDlg(true));
              await page.waitForTimeout(700);
            }

            await page.evaluate(()=>DlgSecProps.show('Msg.setSectionProps'));
            await page.waitForTimeout(1500);
            await dump('section_properties_dialog');
            await page.evaluate(()=>ui.hideDlg(true));

            await page.evaluate(()=>{
              const cmd=JSON.stringify({cmd:'execute_option',option:'set_section',description:'Manage Section',name:'37N_130E_to_138E',type:1,km_width:20,bathy_type:3,bathy_color:17,x_coords:[130,138],y_coords:[37,37]});
              app.sendWsMsg(cmd+','+Msg.msgGetDockDataVarLbls+','+Msg.msgGetCanvasCurrInfo);
            });
            for(const delay of [5000,15000,30000,60000]){
              await page.waitForTimeout(delay===5000?5000:delay-(delay===15000?5000:delay===30000?15000:30000));
              await dump(`section_after_${delay/1000}s`);
            }
          }catch(e){logs.push(`[fatal] ${e.stack||e}`);await dump('fatal').catch(()=>{});}finally{
            fs.writeFileSync(`${OUT}/logs.json`,JSON.stringify(logs,null,2));
            await browser.close();
          }
          JS
          node capture.mjs > webodv-output/stdout.txt 2> webodv-output/stderr.txt
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webodv-dialog-diagnostic
          path: webodv-output
          retention-days: 1
