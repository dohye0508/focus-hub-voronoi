name: Temporary WebODV Capture

on:
  push:
    branches:
      - temp-webodv-capture-20260828

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect WebODV layouts
        continue-on-error: true
        run: |
          mkdir -p webodv-output
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = 'https://explore.webodv.awi.de/ocean/woa18/0.25-degree/1_all-years/1_annual/woa18_0.25deg_all-years_annual/';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1920, height: 1080 },
            locale: 'en-US', timezoneId: 'UTC', ignoreHTTPSErrors: true
          });
          const page = await context.newPage();
          const logs = [];
          page.on('console', msg => logs.push(`[console:${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => logs.push(`[pageerror] ${err.stack || err.message}`));
          page.on('requestfailed', req => logs.push(`[requestfailed] ${req.url()} :: ${req.failure()?.errorText}`));

          async function waitReady(timeout = 120000) {
            await page.waitForFunction(() => {
              try {
                return typeof app !== 'undefined' && app.websocket?.readyState === 1 &&
                  typeof coll !== 'undefined' && coll.dataVarCount?.() > 0 &&
                  typeof view !== 'undefined' &&
                  document.getElementById('ImageArea')?.getAttribute('src')?.startsWith('data:image/png');
              } catch { return false; }
            }, { timeout });
          }

          async function snapshot(name) {
            await page.waitForTimeout(5000);
            const data = await page.evaluate(() => ({
              title: document.title,
              viewXml: view?.toXml?.(),
              viewHistoryName: viewHistory?.currentName?.(),
              collection: {
                name: coll?.name,
                primaryVarId: coll?.primaryVarId,
                dataVars: Array.from({ length: coll?.dataVarCount?.() || 0 }, (_, i) => {
                  const v = coll.dataVar(i);
                  return { index: i, name: v?.name, uname: v?.uname, units: v?.units, uunits: v?.uunits, type: v?.type, varType: v?.varType };
                })
              },
              section: view?.section ? {
                name: view.section.name, type: view.section.type, width: view.section.width,
                bathyType: view.section.bathyType, bathyColor: view.section.bathyColor,
                xml: view.section.toXml?.()
              } : null,
              dataWindows: (view?.dataWinArr || []).map((w, i) => ({
                index: i + 1, scope: w.scope, plotMode: w.plotMode, autoScale: w.autoScale,
                xvId: w.xvId, yvId: w.yvId, zvId: w.zvId,
                xRev: w.xRev, yRev: w.yRev, zRev: w.zRev,
                xLeft: w.xLeft, xRight: w.xRight,
                yBottom: w.yBottom, yTop: w.yTop,
                zBottom: w.zBottom, zTop: w.zTop,
                xml: w.toXml?.(i + 1)
              })),
              viewInfo: {
                dataWinCount: viewInfo?.dataWinCount,
                isGeoMap: viewInfo?.isGeoMap,
                rects: viewInfo ? undefined : undefined
              },
              ui: {
                odvCnvsRects: ui?.odvCnvsRects,
                colbarCnvsRects: ui?.colbarCnvsRects,
                imgBounds: {
                  left: ui?.imgOdvCnvsLeft, right: ui?.imgOdvCnvsRight,
                  top: ui?.imgOdvCnvsTop, bottom: ui?.imgOdvCnvsBottom,
                  pixPerHtmlPix: ui?.odvPixPerHtmlPix
                }
              }
            }));
            fs.writeFileSync(`webodv-output/${name}.json`, JSON.stringify(data, null, 2));
            await page.locator('#ImageArea').screenshot({ path: `webodv-output/${name}.png` });
          }

          try {
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await waitReady();
            await snapshot('00-fullscreen-map');

            await page.evaluate(() => app.layoutApply('miTwoIsoSurfaceWin'));
            await page.waitForFunction(() => view?.dataWinArr?.length === 2 && viewInfo?.dataWinCount === 2, { timeout: 120000 });
            await snapshot('01-two-isosurface');

            await page.evaluate(() => app.layoutApply('miOneScatterWin'));
            await page.waitForFunction(() => view?.dataWinArr?.length === 1 && viewInfo?.dataWinCount === 1, { timeout: 120000 });
            await snapshot('02-one-scatter');

            await page.evaluate(() => app.layoutApply('miOneSectionWin'));
            await page.waitForTimeout(10000);
            await snapshot('03-one-section-attempt');
          } catch (e) {
            logs.push(`[fatal] ${e?.stack || e}`);
            await page.screenshot({ path: 'webodv-output/failure-full-page.png', fullPage: true }).catch(() => {});
          } finally {
            fs.writeFileSync('webodv-output/logs.json', JSON.stringify(logs, null, 2));
            fs.writeFileSync('webodv-output/page.html', await page.content().catch(() => ''));
            await browser.close();
          }
          JS
          node capture.mjs > webodv-output/node-stdout.txt 2> webodv-output/node-stderr.txt
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webodv-layout-diagnostic
          path: webodv-output
          retention-days: 1
