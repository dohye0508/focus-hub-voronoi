name: Temporary WebODV Capture

on:
  push:
    branches:
      - temp-webodv-capture-20260828

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture official WebODV canvases with verified variables
        continue-on-error: true
        run: |
          mkdir -p webodv-fast
          cat > capture-fast.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const OUT='webodv-fast';
          const URL='https://explore.webodv.awi.de/ocean/woa18/0.25-degree/1_all-years/1_annual/woa18_0.25deg_all-years_annual/';
          const report={started:new Date().toISOString(),captures:[],errors:[],dialogs:[]};
          const browser=await chromium.launch({headless:true});
          const saveJson=(n,v)=>fs.writeFileSync(`${OUT}/${n}.json`,JSON.stringify(v,null,2));
          const fail=(n,e)=>{const s=String(e?.stack||e);report.errors.push({name:n,error:s});console.error('FAILED '+n+': '+s);saveJson('capture-report',report);};
          async function open(){const context=await browser.newContext({viewport:{width:1920,height:1080},locale:'en-US',timezoneId:'UTC',ignoreHTTPSErrors:true});const page=await context.newPage();const logs=[];page.on('console',m=>logs.push(`[console:${m.type()}] ${m.text()}`));page.on('pageerror',e=>logs.push(`[pageerror] ${e.stack||e.message}`));await page.goto(URL,{waitUntil:'domcontentloaded',timeout:180000});await page.waitForFunction(()=>{try{return app.websocket?.readyState===1&&coll.dataVars?.count>0&&typeof view!=='undefined'&&document.getElementById('ImageArea')?.naturalWidth>0;}catch{return false;}},null,{timeout:240000});await page.waitForTimeout(3000);return{context,page,logs};}
          async function ready(p,old='',delay=3000,timeout=600000){await p.waitForFunction(()=>{try{return appState.current()===AppState.Ready&&document.getElementById('ImageArea')?.naturalWidth>0;}catch{return false;}},null,{timeout});if(old)await p.waitForFunction(o=>document.getElementById('ImageArea')?.src!==o,old,{timeout}).catch(()=>{});await p.waitForTimeout(delay);}
          async function domain(p,d){const old=await p.locator('#ImageArea').getAttribute('src');await p.evaluate(d=>app.sendWsMsg(Msg.setMapDomain(d.w,d.e,d.s,d.n)+','+Msg.msgGetCanvasCurrInfo),d);await p.waitForFunction(d=>{try{return Math.abs(view.mapWin.wLon-d.w)<.01&&Math.abs(view.mapWin.eLon-d.e)<.01&&Math.abs(view.mapWin.sLat-d.s)<.01&&Math.abs(view.mapWin.nLat-d.n)<.01;}catch{return false;}},d,{timeout:300000});await ready(p,old,2500,300000);}
          async function layout(p,id,n){const old=await p.locator('#ImageArea').getAttribute('src');await p.evaluate(id=>app.layoutApply(id),id);await p.waitForFunction(n=>view.dataWinArr?.length===n,n,{timeout:300000});await ready(p,old,2500,300000);}
          async function axis(p,win,letter,id,text,rev,label){const prop={X:'xvId',Y:'yvId',Z:'zvId'}[letter];const old=await p.locator('#ImageArea').getAttribute('src');await p.evaluate(({win,letter})=>{ui.rclickWinId=win;DlgAxisVar.show(win,letter);},{win,letter});await p.waitForFunction(()=>{const s=document.getElementById('vId');if(!s)return false;const r=s.getBoundingClientRect();return r.width>0&&r.height>0;},null,{timeout:60000});const d=await p.evaluate(({id,text,rev})=>{const s=document.getElementById('vId');const ops=Array.from(s.options);const o=ops.find(x=>Number(x.value)===Number(id))||ops.find(x=>x.text.toLowerCase().includes(text.toLowerCase()));if(!o)return{ok:false,options:ops.map(x=>({value:x.value,text:x.text}))};s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));const r=document.getElementById('rev');if(r)r.checked=rev;return{ok:true,selected:{value:o.value,text:o.text},options:ops.map(x=>({value:x.value,text:x.text}))};},{id,text,rev});report.dialogs.push({label,...d});saveJson('dialog-'+label,d);if(!d.ok)throw new Error('axis option not found '+label);await p.evaluate(letter=>DlgAxisVar.onApply(letter,false),letter);await p.waitForFunction(({win,prop,id})=>{try{return Number(view.dataWinArr[win-1]?.[prop])===Number(id)&&appState.current()===AppState.Ready;}catch{return false;}},{win,prop,id},{timeout:600000});await ready(p,old,2500,600000);}
          async function save(p,name,extra){const s=await p.evaluate(extra=>{const i=document.getElementById('ImageArea');return{src:i.src,collection:coll.name,map:{w:view.mapWin.wLon,e:view.mapWin.eLon,s:view.mapWin.sLat,n:view.mapWin.nLat},section:view.section?{name:view.section.name,type:view.section.type,width:view.section.width,xNodes:view.section.xNodes,yNodes:view.section.yNodes,valid:view.section.isValid?.(),xml:view.section.isValid?.()?view.section.toXml():''}:null,windows:view.dataWinArr.map((w,k)=>({index:k+1,scope:w.scope,plotMode:w.plotMode,xvId:w.xvId,yvId:w.yvId,zvId:w.zvId,xRev:w.xRev,yRev:w.yRev,zRev:w.zRev,DivaUseSecPoly:w.DivaUseSecPoly,DivaBathyFile:w.DivaBathyFile,dataCount:viewInfo.dataCountsByWin?.[k]})),viewXml:view.toXml(),extra};},extra);fs.writeFileSync(`${OUT}/${name}.png`,Buffer.from(s.src.split(',')[1],'base64'));delete s.src;saveJson(name,s);report.captures.push({name,windows:s.windows,extra});saveJson('capture-report',report);return s;}
          async function pWait(p,description,timeout=600000){await p.waitForFunction(x=>{try{return viewHistory.current()?.descr===x&&appState.current()===AppState.Ready;}catch{return false;}},description,{timeout});}
          async function ts(name,d,sea){const{context,page,logs}=await open();try{await domain(page,d);await layout(page,'miOneScatterWin',1);await axis(page,1,'X',2,'Salinity',false,name+'-X');await axis(page,1,'Y',1,'Temperature',false,name+'-Y');await axis(page,1,'Z',0,'Depth',true,name+'-Z');const old=await page.locator('#ImageArea').getAttribute('src');await page.evaluate(()=>{const w=view.dataWinArr[0];w.plotMode=0;w.symbSize=.35;w.drawIsop='T';app.sendWsMsg(Msg.loadView(view.toXml(),viewHistory.currentName(),'Verified T-S'));});await pWait(page,'Verified T-S');await ready(page,old,3500,600000);const s=await save(page,name,{sea,requested:'X=Salinity; Y=Temperature; Z=Depth',source:'official WebODV'});if(s.windows[0].xvId!==2||s.windows[0].yvId!==1||s.windows[0].zvId!==0)throw new Error('TS verification failed');}finally{saveJson(name+'-logs',logs);await context.close();}}
          async function defineSection(p){await domain(p,{w:128,e:140,s:33,n:44});const old=await p.locator('#ImageArea').getAttribute('src');await p.evaluate(()=>{const sec=new Section();sec.setVals('37N_130E_to_138E',1,20*Section.widthCnvFac,3,17);sec.xNodes=[130,138];sec.yNodes=[37,37];const sx=sec.toXml();let b=view.toXml(),a=b.indexOf('<Section')-1,z=b.indexOf('</Section>')+10;if(a===-2){a=b.indexOf('</MapWindow>')+12;z=a;}const v=b.slice(0,a)+sx+b.slice(z);window.__sec={sx,v,values:Object.fromEntries(Object.keys(sec).map(k=>[k,sec[k]]))};app.sendWsMsg(Msg.loadView(v,viewHistory.currentName(),'Verified geographic section'));});await pWait(p,'Verified geographic section');await p.waitForFunction(()=>view.section?.isValid?.()&&view.section?.xNodes?.length===2,null,{timeout:600000});await ready(p,old,3500,600000);saveJson('section-definition',await p.evaluate(()=>window.__sec));}
          async function sectionStyle(p,zid,zname,desc){await axis(p,1,'X',200000,'Section Longitude',false,'sec-X-'+zname);await axis(p,1,'Y',0,'Depth',true,'sec-Y-'+zname);await axis(p,1,'Z',zid,zname,false,'sec-Z-'+zname);const old=await p.locator('#ImageArea').getAttribute('src');await p.evaluate(desc=>{view.setDataWinDispStyleGridded(1,7,'T',2,2,'F','T','T',3);const w=view.dataWinArr[0];w.plotMode=7;w.drawShaded='T';w.drawContours='T';w.autoContours='T';w.contours=[];w.DivaUseSecPoly='T';w.DivaBathyFile='GEBCO_2023_2x2min_Global.nc';w.DivaBathyVal=App.missDOUBLE;app.sendWsMsg(Msg.loadView(view.toXml(),viewHistory.currentName(),desc));},desc);await pWait(p,desc,1200000);await ready(p,old,6000,1200000);}
          async function sections(){const{context,page,logs}=await open();try{await defineSection(page);await layout(page,'miOneSectionWin',1);await sectionStyle(page,1,'Temperature','Verified DIVA Temperature');let s=await save(page,'06-37N-temperature-section',{requested:'37N 130E-138E; X=Section Longitude; Y=Depth; Z=Temperature; DIVA',source:'official WebODV'});if(!s.section?.valid||s.windows[0].xvId!==200000||s.windows[0].yvId!==0||s.windows[0].zvId!==1)throw new Error('temperature section verification failed');await sectionStyle(page,2,'Salinity','Verified DIVA Salinity');s=await save(page,'07-37N-salinity-section',{requested:'37N 130E-138E; X=Section Longitude; Y=Depth; Z=Salinity; DIVA',source:'official WebODV'});if(!s.section?.valid||s.windows[0].xvId!==200000||s.windows[0].yvId!==0||s.windows[0].zvId!==2)throw new Error('salinity section verification failed');}finally{saveJson('section-logs',logs);await context.close();}}
          async function task(n,f){try{console.log('START '+n);await f();console.log('DONE '+n);}catch(e){fail(n,e);}}
          await task('east TS',()=>ts('04-east-sea-TS',{w:127.5,e:142,s:33,n:48},'East Sea'));
          await task('west TS',()=>ts('05-west-sea-TS',{w:119,e:127.5,s:31,n:42},'West Sea'));
          await task('sections',sections);
          report.finished=new Date().toISOString();saveJson('capture-report',report);await browser.close();
          JS
          node capture-fast.mjs > webodv-fast/stdout.txt 2> webodv-fast/stderr.txt
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webodv-fast
          path: webodv-fast
          retention-days: 1
