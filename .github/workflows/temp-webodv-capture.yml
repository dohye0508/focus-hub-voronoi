name: Temporary WebODV Capture

on:
  push:
    branches:
      - temp-webodv-capture-20260828

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect WebODV internals
        continue-on-error: true
        run: |
          mkdir -p webodv-internals
          cat > inspect.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const URL='https://explore.webodv.awi.de/ocean/woa18/0.25-degree/1_all-years/1_annual/woa18_0.25deg_all-years_annual/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1920,height:1080},locale:'en-US',timezoneId:'UTC',ignoreHTTPSErrors:true});
          const page=await context.newPage();
          const logs=[]; page.on('console',m=>logs.push(`[${m.type()}] ${m.text()}`)); page.on('pageerror',e=>logs.push(`[pageerror] ${e.stack||e.message}`));
          try{
            await page.goto(URL,{waitUntil:'domcontentloaded',timeout:150000});
            await page.waitForFunction(()=>{try{return typeof app!=='undefined'&&app.websocket?.readyState===1&&typeof coll!=='undefined'&&!!coll.name&&typeof view!=='undefined'&&document.getElementById('ImageArea')?.src?.startsWith('data:image/');}catch{return false;}},null,{timeout:180000});
            await page.waitForTimeout(7000);
            const result=await page.evaluate(async()=>{
              const src=x=>{try{return x?.toString?.()||String(x);}catch(e){return `ERR:${e}`;}};
              const own=o=>{try{return Object.getOwnPropertyNames(o||{});}catch(e){return [`ERR:${e}`];}};
              const vals=o=>{const r={};for(const k of Object.keys(o||{})){try{const v=o[k];r[k]=typeof v==='function'?src(v):v;}catch(e){r[k]=`ERR:${e}`;}}return r;};
              const methods=(o,stat=false)=>Object.fromEntries(own(o).filter(k=>k!=='constructor'&&typeof o[k]==='function').map(k=>[k,src(o[k])]));
              const s=new Section(); const dw=new DataWindow();
              const base={
                version:app.version,collection:coll.name,
                SectionClass:src(Section),SectionStatic:methods(Section,true),SectionKeys:Object.keys(s),SectionValues:vals(s),SectionPrototype:methods(Section.prototype),
                DlgSecPropsClass:typeof DlgSecProps!=='undefined'?src(DlgSecProps):'missing',DlgSecPropsStatic:typeof DlgSecProps!=='undefined'?methods(DlgSecProps,true):{},
                DlgAxisVarClass:typeof DlgAxisVar!=='undefined'?src(DlgAxisVar):'missing',DlgAxisVarStatic:typeof DlgAxisVar!=='undefined'?methods(DlgAxisVar,true):{},
                DataWindowClass:src(DataWindow),DataWindowKeys:Object.keys(dw),DataWindowValues:vals(dw),DataWindowPrototype:methods(DataWindow.prototype),
                ViewPrototype:Object.fromEntries(own(View.prototype).filter(k=>['setDataWinVars','setDataWinDispStyleGridded','toXml'].includes(k)).map(k=>[k,src(View.prototype[k])])),
                MsgStatic:Object.fromEntries(own(Msg).filter(k=>['createSection','loadView','modifyView','setDwXYZVars','setMapDomain'].includes(k)).map(k=>[k,src(Msg[k])])),
                CollPrototype:Object.fromEntries(own(Collection.prototype).filter(k=>/dataVar|AtSpec|FullLabel|Count|primary/i.test(k)).map(k=>[k,typeof Collection.prototype[k]==='function'?src(Collection.prototype[k]):Collection.prototype[k]])),
                AppConstants:{VID_NONE:App.VID_NONE,VID_SECTION_COORD:App.VID_SECTION_COORD,missDOUBLE:App.missDOUBLE,largeDOUBLE:App.largeDOUBLE},
                currentView:view.toXml(),
                vars:Array.from({length:7},(_,i)=>{try{const v=coll.dataVar(i);return {i,name:v.name,uname:v.uname,units:v.units,keyVarId:v.keyVarId,varType:v.varType};}catch(e){return {i,error:String(e)}}}),
                menu:Array.from(document.querySelectorAll('[id]')).map(e=>({id:e.id,text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,180)})).filter(x=>/^mi/.test(x.id)||/(surface|scatter|section|axis variable)/i.test(x.text)).slice(0,1200)
              };
              // Open a scatter template and inspect each axis dialog without applying.
              const old=viewHistory.size(); app.layoutApply('miOneScatterWin');
              await new Promise(r=>setTimeout(r,12000));
              base.scatterTemplate={historyBefore:old,historyAfter:viewHistory.size(),window:view.dataWinArr[0]?vals(view.dataWinArr[0]):null,xml:view.toXml()};
              base.axisDialogs={};
              for(const axis of ['X','Y','Z']){
                try{
                  DlgAxisVar.show(1,axis); await new Promise(r=>setTimeout(r,1000));
                  const visible=e=>{const q=e.getBoundingClientRect();return q.width>0&&q.height>0&&getComputedStyle(e).visibility!=='hidden';};
                  base.axisDialogs[axis]={
                    bodyText:Array.from(document.querySelectorAll('.PopupDlg')).filter(visible).map(e=>e.innerText).join('\n'),
                    selects:Array.from(document.querySelectorAll('select')).filter(visible).map(e=>({id:e.id,value:e.value,options:Array.from(e.options).map(o=>({value:o.value,text:o.text,selected:o.selected}))})),
                    inputs:Array.from(document.querySelectorAll('input')).filter(visible).map(e=>({id:e.id,type:e.type,value:e.value,checked:e.checked})),
                    buttons:Array.from(document.querySelectorAll('button')).filter(visible).map(e=>({id:e.id,text:(e.innerText||e.textContent||'').trim(),onclick:e.getAttribute('onclick')}))
                  };
                  ui.hideDlg(true); await new Promise(r=>setTimeout(r,300));
                }catch(e){base.axisDialogs[axis]={error:String(e?.stack||e)};try{ui.hideDlg(true);}catch{}}
              }
              // Populate section through the exact class members discovered by point clicks if possible: only inspect fresh instance here.
              return base;
            });
            fs.writeFileSync('webodv-internals/internals.json',JSON.stringify(result,null,2));
            fs.writeFileSync('webodv-internals/logs.json',JSON.stringify(logs,null,2));
            await page.screenshot({path:'webodv-internals/page.png',fullPage:true});
          }catch(e){fs.writeFileSync('webodv-internals/error.txt',String(e?.stack||e));await page.screenshot({path:'webodv-internals/failure.png',fullPage:true}).catch(()=>{});}finally{await browser.close();}
          JS
          node inspect.mjs > webodv-internals/stdout.txt 2> webodv-internals/stderr.txt
      - name: Upload internals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webodv-internals
          path: webodv-internals
          retention-days: 1
